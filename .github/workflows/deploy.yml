name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Verify static output
        run: |
          test -f .output/public/index.html
          cp .output/public/index.html .output/public/404.html
      - name: Fix asset paths for project Pages URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".output/public")
          replacements = {
              '="/assets/': '="/pixel-perfect-replica/assets/',
              '"/assets/': '"/pixel-perfect-replica/assets/',
              '="/manifest.webmanifest': '="/pixel-perfect-replica/manifest.webmanifest',
              '="/icon-512.png': '="/pixel-perfect-replica/icon-512.png',
              '="/favicon.png': '="/pixel-perfect-replica/favicon.png',
          }
          for page in root.rglob("*.html"):
              html = page.read_text()
              for old, new in replacements.items():
                  html = html.replace(old, new)
              page.write_text(html)

          # TanStack Start also emits absolute asset URLs inside JavaScript chunks.
          # Rewrite those root-relative references for the GitHub Pages subpath.
          for bundle in root.rglob("*.js"):
              js = bundle.read_text()
              js = js.replace('" /assets/', '"/pixel-perfect-replica/assets/')
              js = js.replace('"/assets/', '"/pixel-perfect-replica/assets/')
              js = js.replace("'/assets/", "'/pixel-perfect-replica/assets/")
              js = js.replace("`/assets/", "`/pixel-perfect-replica/assets/")
              bundle.write_text(js)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
