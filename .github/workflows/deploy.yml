name: Build and publish High5 Vocabulary

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "high5-publish"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Prepare GitHub Pages output
        run: |
          test -f .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".output/public")
          replacements = {
              '="/assets/': '="/pixel-perfect-replica/assets/',
              '"/assets/': '"/pixel-perfect-replica/assets/',
              '="/manifest.webmanifest': '="/pixel-perfect-replica/manifest.webmanifest',
              '="/icon-512.png': '="/pixel-perfect-replica/icon-512.png',
              '="/favicon.png': '="/pixel-perfect-replica/favicon.png',
          }
          for page in root.rglob("*.html"):
              html = page.read_text()
              for old, new in replacements.items():
                  html = html.replace(old, new)
              page.write_text(html)

          for bundle in root.rglob("*.js"):
              js = bundle.read_text()
              js = js.replace('" /assets/', '"/pixel-perfect-replica/assets/')
              js = js.replace('"/assets/', '"/pixel-perfect-replica/assets/')
              js = js.replace("'/assets/", "'/pixel-perfect-replica/assets/")
              js = js.replace("`/assets/", "`/pixel-perfect-replica/assets/")
              bundle.write_text(js)
          PY

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .output/public
          force_orphan: true
